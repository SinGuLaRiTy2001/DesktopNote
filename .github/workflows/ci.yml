name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff==0.17.3

      - name: Check the code with ruff (settings in pyproject.toml)
        run: ruff check .

  test:
    # The app uses Win32 / DWM APIs, so tests run on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen  # No windows are shown; tests only need Qt's classes.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its dependencies from pyproject.toml
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover tests -v

  release-pins:
    # The exact versions the release is built with (scripts/release-requirements.txt).
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/release-requirements.txt

      - name: Install the pinned release versions
        run: python -m pip install -r scripts/release-requirements.txt

      - name: Run unit tests
        run: python -m unittest discover tests -v
