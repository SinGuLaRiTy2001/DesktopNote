[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktopnote"
version = "1.0.0rc6"
description = "Minimal frosted-glass sticky notes for the Windows desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.12"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["ruff>=0.17"]

[project.gui-scripts]
desktopnote = "desktopnote.app:main"

[project.scripts]
desktopnote-cli = "desktopnote.cli:main"

[tool.setuptools.packages.find]
include = ["desktopnote*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["desktopnote"]
